---
# Security Tools - Ansible Inventory
#
# Configure your target hosts here
#

all:
  hosts:
    # Local machine
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  children:
    # Security workstations
    workstations:
      hosts:
        localhost:

    # GPU server for hash cracking, ML, etc.
    gpu_servers:
      hosts:
        loq:
          ansible_host: loq
          ansible_user: me

    # Remote security labs
    security_labs:
      hosts:
